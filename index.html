<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button>Rock</button>
    <button>Paper</button>
    <button>Scissors</button>

    <script>
        
        function getComputerChoice () {
            let computerChoice = Math.floor(Math.random()*3)

            if (computerChoice == 0) {
                return "rock";
            } else if (computerChoice == 1) {
                return "paper";
            } else {
                return "scissors";
            }
        }

        function getHumanChoice () {
            return prompt("rock, paper, scissors?");
        }

        let computerScore = 0;

        let humanScore = 0;

        function playRound (humanChoice, computerChoice) {
            humanChoice = humanChoice.toLowerCase();

            const scoreDisplay = document.createElement("div");

            if (humanScore == 5) {
                alert("You win this game!");
                return;
            } else if (computerScore === 5) {
                alert("You lose this game!");
                return;
            } else if ((humanChoice == "rock" && computerChoice == "rock") || (humanChoice == "paper" && computerChoice == "paper") || (humanChoice == "scissors" && computerChoice == "scissors")) {
                const roundResult = document.createElement("p");
                roundResult.textContent = "It's a draw!"
                

                scoreDisplay.appendChild(roundResult);
                document.body.appendChild(scoreDisplay);
                
            } else if ((humanChoice == "rock" && computerChoice == "paper") || (humanChoice == "paper" && computerChoice == "scissors") || (humanChoice == "scissors" && computerChoice == "rock")) {
                const roundResult = document.createElement("p");
                roundResult.textContent = "You lose!"
                
                scoreDisplay.appendChild(roundResult);
                document.body.appendChild(scoreDisplay);
                
                computerScore++;

            } else if ((humanChoice == "rock" && computerChoice == "scissors") || (humanChoice == "paper" && computerChoice == "rock") || (humanChoice == "scissors" && computerChoice == "paper")) {
                const roundResult = document.createElement("p");
                roundResult.textContent = "You win!"
                
                
                scoreDisplay.appendChild(roundResult);
                document.body.appendChild(scoreDisplay);

                humanScore++;
            }
        }

        //playRound(getHumanChoice(), getComputerChoice());

        //console.log("You:" + humanScore + " Computer:" + computerScore);

        function playGame () {
            //playRound(getHumanChoice(), getComputerChoice());
            //playRound(getHumanChoice(), getComputerChoice());
            //playRound(getHumanChoice(), getComputerChoice());
            //playRound(getHumanChoice(), getComputerChoice());
            //playRound(getHumanChoice(), getComputerChoice());

            console.log("Final score... You:" + humanScore + " Computer:" + computerScore);
        }

        const buttons = document.querySelectorAll("button");

        buttons.forEach((button) => {
            button.addEventListener("click", (event) => {
                playRound(event.target.textContent, getComputerChoice());
            });
            });        

        //playGame();

    </script>


</body>
</html>
